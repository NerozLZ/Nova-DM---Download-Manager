[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-dm"
dynamic = ["version"]
description = "Nova Download Manager - gestor de downloads para Linux baseado em aria2 e PySide6"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[project.scripts]
nova-dm = "nova_dm.main:main"

[tool.setuptools.dynamic]
version = { attr = "nova_dm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova_dm = ["translations/*.qm", "translations/*.ts", "assets/*.svg", "legal/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: testes que arrancam um aria2c real e um servidor HTTP local",
]
