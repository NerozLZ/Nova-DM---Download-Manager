# Manifesto Flatpak do Nova DM.
# NÃO FOI CONSTRUÍDO: o flatpak-builder não existe no ambiente onde o projeto foi escrito.
# Os ramos (KDE 6.11 / PySide BaseApp 6.11) foram confirmados no repositório do Flathub em 2026-10-16.
# Construir com: flatpak/build.sh
app-id: app.novadm.NovaDM
runtime: org.kde.Platform         # o PySide BaseApp é construído sobre o runtime KDE
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: nova-dm

finish-args:
  - --share=network               # descarregar ficheiros
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download     # pasta de downloads predefinida
  # Sem --filesystem=host: outras pastas escolhem-se pelo portal de ficheiros (diálogo nativo).

modules:
  - name: aria2
    buildsystem: autotools
    no-parallel-make: true  # evita o código 137 (falta de memória) ao compilar o aria2
    config-opts:
      - --without-libxml2
      - --without-libgcrypt
      - --with-openssl
      - --without-sqlite3
      - --disable-bittorrent
      - --disable-metalink
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: nova-dm
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 flatpak/app.novadm.NovaDM.desktop ${FLATPAK_DEST}/share/applications/app.novadm.NovaDM.desktop
      - install -Dm644 src/nova_dm/assets/logo.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/app.novadm.NovaDM.svg
    sources:
      - type: dir
        path: ..
